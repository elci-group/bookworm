[package]
name = "bookworm-measure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Deterministic measurement: bytes, lines, hashes, approximate token accounting (directive section 7)."

[dependencies]
bookworm-core = { workspace = true }
bookworm-classify = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Tests are unit + integration only (see crates/bookworm-cli/tests); rustdoc
# doctest execution is disabled so `cargo test` does not depend on rustdoc.
[lib]
doctest = false
