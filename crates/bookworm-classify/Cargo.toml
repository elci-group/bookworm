[package]
name = "bookworm-classify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Deterministic content classification, language mapping, generated/vendored heuristics (directive section 6)."

[dependencies]
bookworm-core = { workspace = true }
serde = { workspace = true }

# Tests are unit + integration only (see crates/bookworm-cli/tests); rustdoc
# doctest execution is disabled so `cargo test` does not depend on rustdoc.
[lib]
doctest = false
