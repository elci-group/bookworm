[package]
name = "bookworm-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Filesystem scope enforcement and read-only acquisition posture (directive sections 4, 19)."

[dependencies]
bookworm-core = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Tests are unit + integration only (see crates/bookworm-cli/tests); rustdoc
# doctest execution is disabled so `cargo test` does not depend on rustdoc.
[lib]
doctest = false
