[package]
name = "bookworm-verify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Deterministic verification engine for machine-checkable assertions (directive section 13)."

[dependencies]
bookworm-core = { workspace = true }
bookworm-classify = { workspace = true }
bookworm-measure = { workspace = true }
bookworm-resolver = { workspace = true }
regex = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Tests are unit + integration only (see crates/bookworm-cli/tests); rustdoc
# doctest execution is disabled so `cargo test` does not depend on rustdoc.
[lib]
doctest = false
